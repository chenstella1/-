<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>優華數位英文學習題庫刷題網</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2pdf.js 支援錯題本與試卷轉成 PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>
  <style>
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: #fff !important; color: #000 !important; }
      .card-box { border: 1px solid #ccc !important; box-shadow: none !important; margin-bottom: 15px !important; break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- 1. 登入畫面 (Modal) -->
  <div id="login-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border border-slate-100">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">優華數位英文學習網</h2>
        <p class="text-xs text-slate-500 mt-1">請輸入您的學生/教師 Email 與密碼登入系統</p>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">電子郵件 (Email)</label>
          <input type="email" id="login-email" required placeholder="student@example.com" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">登入密碼 (向老師索取)</label>
          <input type="password" id="login-pass" required placeholder="請輸入密碼" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
          <p class="text-[11px] text-slate-400 mt-1">* 提示：預設學生密碼為 123456</p>
        </div>
        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm text-sm">
          驗證並登入刷題網
        </button>
      </form>
    </div>
  </div>

  <!-- 頂部導覽列 -->
  <header class="bg-brand-600 text-white shadow-md no-print">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-xl font-black tracking-wide">優華數位英文</span>
        <span class="text-xs bg-brand-700 text-brand-100 px-2 py-0.5 rounded-full font-normal">刷題網</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="user-status" class="text-xs bg-brand-700 px-3 py-1.5 rounded-full">未登入</span>
        <button onclick="switchTab('quiz')" class="text-xs hover:underline">主頁測驗</button>
        <button onclick="switchTab('wrong-notebook')" class="text-xs bg-amber-500 hover:bg-amber-600 text-white px-2.5 py-1 rounded-full relative">
          錯題區 <span id="wrong-count-badge" class="bg-red-600 text-white text-[10px] px-1.5 py-0.2 rounded-full hidden">0</span>
        </button>
        <button onclick="logout()" class="text-xs text-brand-100 hover:text-white underline">登出</button>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full">
    
    <!-- 頁籤一：測驗與出題主頁 -->
    <div id="tab-quiz" class="space-y-6">
      
      <!-- 2 & 3. 跨層級與多選設定面板 -->
      <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 no-print">
        <h2 class="text-base font-bold text-slate-800 mb-4 border-l-4 border-brand-500 pl-3 flex items-center justify-between">
          <span>題目選擇與過濾條件</span>
          <button onclick="loadQuestions()" class="text-xs font-normal text-brand-600 hover:underline">🔄 重新同步 Google Sheet 題庫</button>
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
          
          <!-- 年級複選區 -->
          <div class="md:col-span-5 border-r border-slate-100 pr-0 md:pr-4">
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">1. 選擇年級 (可複選多個)</label>
            <div class="grid grid-cols-3 gap-2 text-xs" id="grade-checkboxes">
              <label class="flex items-center gap-1.5 p-2 rounded bg-slate-50 hover:bg-slate-100 cursor-pointer">
                <input type="checkbox" value="國七" class="grade-cb text-brand-600 rounded"> 國七
              </label>
              <label class="flex items-center gap-1.5 p-2 rounded bg-slate-50 hover:bg-slate-100 cursor-pointer">
                <input type="checkbox" value="國八" class="grade-cb text-brand-600 rounded"> 國八
              </label>
              <label class="flex items-center gap-1.5 p-2 rounded bg-slate-50 hover:bg-slate-100 cursor-pointer">
                <input type="checkbox" value="國九" class="grade-cb text-brand-600 rounded"> 國九
              </label>
              <label class="flex items-center gap-1.5 p-2 rounded bg-slate-50 hover:bg-slate-100 cursor-pointer">
                <input type="checkbox" value="高一" class="grade-cb text-brand-600 rounded"> 高一
              </label>
              <label class="flex items-center gap-1.5 p-2 rounded bg-slate-50 hover:bg-slate-100 cursor-pointer">
                <input type="checkbox" value="高二" class="grade-cb text-brand-600 rounded"> 高二
              </label>
              <label class="flex items-center gap-1.5 p-2 rounded bg-slate-50 hover:bg-slate-100 cursor-pointer">
                <input type="checkbox" value="高三" class="grade-cb text-brand-600 rounded"> 高三
              </label>
            </div>
          </div>

          <!-- 類別與單元關鍵字 -->
          <div class="md:col-span-4 border-r border-slate-100 pr-0 md:pr-4 space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">2. 學習類別 (下一層選單)</label>
              <select id="category-select" class="w-full border-slate-200 rounded-lg text-sm p-2 border">
                <option value="all">全部 (單字 + 文法)</option>
                <option value="單字">單字單元</option>
                <option value="文法">文法單元</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">單元關鍵字 (留空代表全部)</label>
              <input type="text" id="unit-input" placeholder="如：時態, 關係代名詞" class="w-full border-slate-200 rounded-lg text-sm p-2 border">
            </div>
          </div>

          <!-- 題數 -->
          <div class="md:col-span-3 space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">3. 練習題數</label>
              <input type="number" id="question-count" value="10" min="1" max="100" class="w-full border-slate-200 rounded-lg text-sm p-2 border">
            </div>
          </div>

        </div>

        <!-- 4. 雙模式按鈕選擇 -->
        <div class="mt-6 pt-4 border-t border-slate-100 flex flex-wrap gap-3">
          <button onclick="startQuiz('online')" class="bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg shadow-sm flex items-center gap-2">
            🚀 線上練習 (亂數出題 + 即時解析)
          </button>
          <button onclick="startQuiz('print')" class="bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium px-5 py-2.5 rounded-lg shadow-sm flex items-center gap-2">
            🖨️ 生成可列印試卷 (列印/PDF)
          </button>
        </div>

      </section>

      <!-- 狀態提示 -->
      <div id="status-msg" class="p-3.5 rounded-xl text-sm border hidden no-print"></div>

      <!-- 測驗與試卷展示區 -->
      <section id="quiz-container" class="space-y-4"></section>
      
      <!-- 試卷列印控制按鈕區 -->
      <div id="print-actions" class="hidden flex gap-3 justify-end no-print">
        <button onclick="window.print()" class="bg-slate-700 text-white px-4 py-2 rounded-lg text-sm">直接列印題目卷</button>
        <button onclick="exportToPDF('quiz-container', '英文試卷')" class="bg-brand-600 text-white px-4 py-2 rounded-lg text-sm">下載 PDF 題目卷</button>
      </div>

    </div>

    <!-- 頁籤二：6. 錯題區本 -->
    <div id="tab-wrong" class="hidden space-y-4">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center no-print">
        <div>
          <h2 class="text-lg font-bold text-slate-800">專屬錯題複習區</h2>
          <p class="text-xs text-slate-500">系統已為您自動收集答錯的題目，可隨時列印或導出為 PDF 講義。</p>
        </div>
        <div class="flex gap-2">
          <button onclick="exportToPDF('wrong-list-container', '英文錯題本')" class="bg-brand-600 hover:bg-brand-700 text-white text-xs px-3.5 py-2 rounded-lg">匯出錯題本 PDF</button>
          <button onclick="window.print()" class="bg-slate-700 text-white text-xs px-3.5 py-2 rounded-lg">列印錯題講義</button>
          <button onclick="clearWrongQuestions()" class="bg-red-50 text-red-600 hover:bg-red-100 text-xs px-3.5 py-2 rounded-lg border border-red-200">清空錯題本</button>
        </div>
      </div>

      <div id="wrong-list-container" class="space-y-4"></div>
    </div>

  </main>

  <script>
    // 綁定最新 Google Sheet ID[cite: 1]
    const SPREADSHEET_ID = '11rFyQ1FLFflBAUzBoJGI2p8EChYSJWuje16DkZZdSWc';
    const GOOGLE_SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

    let currentUser = null;
    let rawQuestions = [];
    let wrongQuestions = JSON.parse(localStorage.getItem('yh_wrong_questions') || '[]');

    // 初始化與驗證
    window.onload = () => {
      updateWrongBadge();
      const savedUser = localStorage.getItem('yh_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('user-status').innerText = `👤 ${currentUser.email}`;
        loadQuestions();
      }
    };

    // 1. 登入邏輯 (學生密碼 123456, 教師/管理員密碼 admin123)
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-pass').value.trim();

      if (pass === '123456' || pass === 'admin123') {
        currentUser = { email, role: pass === 'admin123' ? 'admin' : 'student' };
        localStorage.setItem('yh_user', JSON.stringify(currentUser));
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('user-status').innerText = `👤 ${email}`;
        loadQuestions();
      } else {
        alert('登入密碼錯誤！請向老師索取正確密碼 (預設為 123456)。');
      }
    }

    function logout() {
      localStorage.removeItem('yh_user');
      location.reload();
    }

    // 載入 Google Sheet 題庫資料[cite: 1]
    async function loadQuestions() {
      showStatus('連線至 Google Sheet 試算表載入最新題庫中...', 'info');
      try {
        const res = await fetch(GOOGLE_SHEET_URL);
        const text = await res.text();
        const jsonText = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const data = JSON.parse(jsonText);
        
        const rows = data.table.rows || [];
        rawQuestions = rows.map((r, idx) => {
          const c = r.c || [];
          return {
            id: idx + 1,
            grade: c[0] ? String(c[0].v).trim() : '',       // 欄位 A: 年級 (如: 高一, 國七)
            category: c[1] ? String(c[1].v).trim() : '文法', // 欄位 B: 類別 (如: 單字, 文法)
            unit: c[2] ? String(c[2].v).trim() : '',        // 欄位 C: 單元名稱
            title: c[3] ? String(c[3].v).trim() : '',       // 欄位 D: 題目
            optionA: c[4] ? String(c[4].v) : '',            // 欄位 E: 選項 A
            optionB: c[5] ? String(c[5].v) : '',            // 欄位 F: 選項 B
            optionC: c[6] ? String(c[6].v) : '',            // 欄位 G: 選項 C
            optionD: c[7] ? String(c[7].v) : '',            // 欄位 H: 選項 D
            answer: c[8] ? String(c[8].v).trim().toUpperCase() : '', // 欄位 I: 解答 (A/B/C/D)
            analysis: c[9] ? String(c[9].v) : '暫無詳細解析'   // 欄位 J: 解析
          };
        }).filter(q => q.title);

        showStatus(`成功載入 ${rawQuestions.length} 筆試題！請設定條件並選擇練習模式。`, 'success');
      } catch (err) {
        showStatus('題庫讀取失敗，請確認 Google Sheet 是否已設定「知道連結者皆可檢視」公開權限。', 'error');
      }
    }

    // 3. 多選條件過濾與抽題
    function getFilteredQuestions() {
      // 取得勾選的年級
      const selectedGrades = Array.from(document.querySelectorAll('.grade-cb:checked')).map(cb => cb.value);
      const selectedCategory = document.getElementById('category-select').value;
      const unitKeyword = document.getElementById('unit-input').value.trim().toLowerCase();

      return rawQuestions.filter(q => {
        // 年級篩選 (有勾選時才過濾)
        if (selectedGrades.length > 0 && !selectedGrades.includes(q.grade)) return false;
        // 類別篩選
        if (selectedCategory !== 'all' && q.category !== selectedCategory) return false;
        // 單元關鍵字篩選
        if (unitKeyword && !q.unit.toLowerCase().includes(unitKeyword)) return false;
        return true;
      });
    }

    // 4. 開始出題 (線上模式 or 列印模式)
    function startQuiz(mode) {
      const filtered = getFilteredQuestions();
      const count = parseInt(document.getElementById('question-count').value) || 10;

      if (filtered.length === 0) {
        showStatus('找不到符合條件的題目，請重新調整年級或單元條件！', 'error');
        return;
      }

      // 隨機抽題
      const quizQuestions = [...filtered].sort(() => 0.5 - Math.random()).slice(0, count);
      const container = document.getElementById('quiz-container');
      const actionBox = document.getElementById('print-actions');
      container.innerHTML = '';

      if (mode === 'online') {
        actionBox.classList.add('hidden');
        renderOnlineQuiz(container, quizQuestions);
        showStatus(`已挑選 ${quizQuestions.length} 題，請點擊選項作答 (將即時顯示解析與答案)。`, 'success');
      } else {
        actionBox.classList.remove('hidden');
        renderPrintableQuiz(container, quizQuestions);
        showStatus(`已為您產出 ${quizQuestions.length} 題試卷，可點擊下方按鈕直接列印或匯出 PDF。`, 'success');
      }
    }

    // 5. 線上練習模式 (點擊即時回饋與答案解析 + 6. 自動納入錯題)
    function renderOnlineQuiz(container, questions) {
      questions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-200 card-box";
        card.id = `q-card-${q.id}`;
        card.innerHTML = `
          <div class="flex items-center gap-2 mb-3">
            <span class="bg-brand-100 text-brand-700 text-xs px-2.5 py-0.5 rounded-full font-bold">第 ${idx + 1} 題</span>
            <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded">${q.grade || '通用'} / ${q.category || '文法'}</span>
            <span class="text-xs text-slate-400">${q.unit}</span>
          </div>
          <div class="text-slate-800 font-medium mb-4 text-base">${q.title}</div>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm mb-4">
            ${['A', 'B', 'C', 'D'].map(opt => `
              <button onclick="checkAnswer(${q.id}, '${opt}', '${q.answer}')" 
                class="opt-btn-${q.id} w-full text-left p-3 rounded-xl border border-slate-200 hover:bg-slate-50 transition-all flex items-center justify-between">
                <span><strong class="text-slate-400 mr-2">${opt}.</strong> ${q[`option${opt}`]}</span>
              </button>
            `).join('')}
          </div>

          <!-- 即時答案與解析回饋區 -->
          <div id="feedback-${q.id}" class="hidden p-4 rounded-xl text-sm border space-y-1"></div>
        `;
        container.appendChild(card);
      });
    }

    // 檢查答案與即時顯示解析
    function checkAnswer(qId, selectedOpt, correctOpt) {
      const q = rawQuestions.find(item => item.id === qId);
      const feedbackEl = document.getElementById(`feedback-${qId}`);
      const buttons = document.querySelectorAll(`.opt-btn-${qId}`);

      // 禁用該題按鈕，防止重複選擇
      buttons.forEach(btn => btn.disabled = true);

      const isCorrect = selectedOpt === correctOpt;

      if (isCorrect) {
        feedbackEl.className = "p-4 rounded-xl text-sm border bg-green-50 border-green-200 text-green-800";
        feedbackEl.innerHTML = `
          <div class="font-bold text-green-700 flex items-center gap-1.5 mb-1">✅ 回饋：回答正確！</div>
          <div><strong>正確答案：</strong> (${correctOpt})</div>
          <div class="text-xs text-green-900 mt-1"><strong>【題目解析】</strong> ${q.analysis}</div>
        `;
      } else {
        feedbackEl.className = "p-4 rounded-xl text-sm border bg-red-50 border-red-200 text-red-800";
        feedbackEl.innerHTML = `
          <div class="font-bold text-red-700 flex items-center gap-1.5 mb-1">❌ 回饋：回答錯誤 (已存入錯題區)</div>
          <div><strong>您的選擇：</strong> ${selectedOpt} | <strong>正確答案：</strong> (${correctOpt})</div>
          <div class="text-xs text-red-900 mt-1"><strong>【題目解析】</strong> ${q.analysis}</div>
        `;
        // 6. 自動記錄至錯題本[cite: 1]
        addWrongQuestion(q);
      }

      feedbackEl.classList.remove('hidden');
    }

    // 4. 生成可列印試卷模式
    function renderPrintableQuiz(container, questions) {
      const paper = document.createElement('div');
      paper.className = "bg-white p-8 rounded-xl border border-slate-200 shadow-sm space-y-6";
      paper.innerHTML = `
        <div class="text-center border-b pb-4 mb-6">
          <h1 class="text-2xl font-bold">優華數位英文測驗卷</h1>
          <p class="text-xs text-slate-500 mt-1">班級：________ 姓名：________ 座號：________ 得分：________</p>
        </div>
        ${questions.map((q, idx) => `
          <div class="space-y-2 break-inside-avoid">
            <div class="font-medium text-slate-800 text-sm">
              ${idx + 1}. (${q.grade}/${q.category}) ${q.title}
            </div>
            <div class="grid grid-cols-2 gap-x-8 gap-y-1 text-xs pl-4">
              <div>(A) ${q.optionA}</div>
              <div>(B) ${q.optionB}</div>
              <div>(C) ${q.optionC}</div>
              <div>(D) ${q.optionD}</div>
            </div>
          </div>
        `).join('')}
      `;
      container.appendChild(paper);
    }

    // 6. 錯題本管理[cite: 1]
    function addWrongQuestion(q) {
      if (!wrongQuestions.some(item => item.id === q.id)) {
        wrongQuestions.push(q);
        localStorage.setItem('yh_wrong_questions', JSON.stringify(wrongQuestions));
        updateWrongBadge();
        renderWrongNotebook();
      }
    }

    function renderWrongNotebook() {
      const container = document.getElementById('wrong-list-container');
      if (wrongQuestions.length === 0) {
        container.innerHTML = `<div class="bg-white p-8 rounded-xl text-center text-slate-400 text-sm">目前沒有任何錯題紀錄，太棒了！</div>`;
        return;
      }

      container.innerHTML = wrongQuestions.map((q, idx) => `
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm card-box">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded">錯題 #${idx + 1}</span>
            <span class="text-xs text-slate-400">${q.grade} / ${q.unit}</span>
          </div>
          <div class="font-medium text-slate-800 mb-3 text-sm">${q.title}</div>
          <div class="text-xs text-slate-600 space-y-1 mb-3 pl-2 border-l-2 border-slate-200">
            <div>(A) ${q.optionA}</div>
            <div>(B) ${q.optionB}</div>
            <div>(C) ${q.optionC}</div>
            <div>(D) ${q.optionD}</div>
          </div>
          <div class="bg-slate-50 p-3 rounded-lg text-xs border border-slate-100">
            <span class="font-bold text-brand-700">正確答案：(${q.answer})</span>
            <p class="text-slate-600 mt-1"><strong>解析：</strong>${q.analysis}</p>
          </div>
        </div>
      `).join('');
    }

    function clearWrongQuestions() {
      if (confirm('確定要清空錯題區的所有紀錄嗎？')) {
        wrongQuestions = [];
        localStorage.removeItem('yh_wrong_questions');
        updateWrongBadge();
        renderWrongNotebook();
      }
    }

    function updateWrongBadge() {
      const badge = document.getElementById('wrong-count-badge');
      if (wrongQuestions.length > 0) {
        badge.innerText = wrongQuestions.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    // 頁籤切換
    function switchTab(tab) {
      if (tab === 'quiz') {
        document.getElementById('tab-quiz').classList.remove('hidden');
        document.getElementById('tab-wrong').classList.add('hidden');
      } else {
        document.getElementById('tab-quiz').classList.add('hidden');
        document.getElementById('tab-wrong').classList.remove('hidden');
        renderWrongNotebook();
      }
    }

    // PDF 匯出功能
    function exportToPDF(elementId, filename) {
      const element = document.getElementById(elementId);
      const opt = {
        margin:       10,
        filename:     `${filename}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }

    function showStatus(msg, type = 'info') {
      const el = document.getElementById('status-msg');
      el.classList.remove('hidden', 'bg-blue-50', 'text-blue-700', 'bg-red-50', 'text-red-700', 'bg-green-50', 'text-green-700');
      
      if (type === 'error') el.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
      else if (type === 'success') el.classList.add('bg-green-50', 'text-green-700', 'border-green-200');
      else el.classList.add('bg-blue-50', 'text-blue-700', 'border-blue-200');
      
      el.innerText = msg;
    }
  </script>
</body>
</html>
